<body>

<header class="site-header">
    <div class="container">

        <a class="logo" href="index.html">
            Chaithra M K
        </a>

        <nav aria-label="Primary navigation">
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>

    </div>
</header>

<main id="main-content">

    <header class="page-header">
        <div class="container">
            <h1>Contact Me</h1>
            <p>I'd be happy to hear from you.</p>
        </div>
    </header>

    <section class="section" aria-labelledby="contact-form-title">

        <div class="container contact-container">

            <h2 id="contact-form-title">Send a Message</h2>

            <form id="contact-form" novalidate>

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true"
                        aria-describedby="name-help">

                    <small id="name-help">
                        Please enter your full name.
                    </small>

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true"
                        aria-describedby="email-help">

                    <small id="email-help">
                        Enter a valid email address.
                    </small>

                </div>

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        aria-required="true">

                </div>

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        aria-required="true"
                        aria-describedby="message-help"></textarea>

                    <small id="message-help">
                        Enter your message.
                    </small>

                </div>

                <button type="submit" class="button">
                    Send Message
                </button>

                <p
                    id="form-status"
                    class="form-status"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

        </div>

    </section>

</main>
